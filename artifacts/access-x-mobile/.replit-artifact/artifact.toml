kind = "mobile"
previewPath = "/access-x-mobile/"
title = "ACCESS-X Mobile"
description = "A mobile accessibility companion that lets blind and low-vision users ask what is in front of them, hear what changed, and get route-aware next steps with clear confidence and safety language."
version = "1.0.0"
id = "artifacts/access-x-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/access-x-mobile/" ]
localPort = 20762

[services.development]
run = "pnpm --filter @workspace/access-x-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/access-x-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/access-x-mobile", "run", "serve" ]

[services.env]
PORT = "20762"
BASE_PATH = "/access-x-mobile/"
